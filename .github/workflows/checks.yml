# Runs on every push and pull request: free on public repositories (GitHub-hosted runner, a few seconds).
name: model checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Privacy check (no user paths or e-mail addresses in the repo)
        run: bash scripts/privacy_check.sh
      - name: Static model and report checks; generated files in sync with the scripts
        run: python tests/test_model.py

  replicate-data:
    # Proves the committed data is fictitious and reproducible: rebuild data/ from Microsoft's public AdventureWorksDW sample
    # with the seeded generator and compare every file to data/MANIFEST.sha256 (free on public repositories, about a minute).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the public AdventureWorksDW sample (microsoft/sql-server-samples, MIT)
        run: |
          curl -sSL -o aw.zip https://github.com/microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorksDW-data-warehouse-install-script.zip
          python -c "import zipfile; zipfile.ZipFile('aw.zip').extractall('aw')"
      - name: Rebuild data/ with the seeded generator (seed 20261111)
        run: python -I scripts/build_data.py aw rebuilt
      - name: Committed data must match the rebuild byte for byte
        run: |
          python -I scripts/verify_data.py rebuilt
          python -I scripts/verify_data.py
      - name: Anonymiser self-test (masked copy keeps keys and ratios, leaks no names)
        run: python -I scripts/anonymise_data.py data masked --seed 1
